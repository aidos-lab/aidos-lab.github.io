{{- define "main" }}
  <h1>{{ .Title }}</h1>

  {{- .Content }}

  <ul class="post-list">
    {{- range .Pages }}
      <li>
        <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006-01-02" }}</time>: <a href="{{ .RelPermalink }}">{{ .Title }}{{ with .Params.subtitle }}: <span class="subtitle">{{ . }}</span>{{ end }}</a>
      </li>
    {{- end }}
  </ul>
{{- end }}
