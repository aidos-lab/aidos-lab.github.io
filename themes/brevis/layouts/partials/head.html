<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta property="og:url" content="{{ .Permalink }}">
  <meta property="og:type" content="website">

  <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title | markdownify | plainify }} · {{ site.Title }}{{ end }}</title>
  <meta property="og:title" content="{{ .Title | markdownify | plainify }}">

  {{- with .Description | default .Site.Params.description }}
  <meta name="description" content="{{ . }}">
  <meta property="og:description" content="{{ . }}">
  {{- end }}

  {{- with .Site.Params.ogImage }}
  <meta property="og:image" content="{{ absURL . }}">
  <meta property="og:image:width" content="1280">
  <meta property="og:image:height" content="720">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:site" content="@Pseudomanifold">
  <meta name="twitter:image" content="{{ absURL . }}">
  {{- end }}

  <link rel="stylesheet" href="{{ relURL "css/style.css" }}">

  {{- with .Site.Params.googleTagID }}
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id={{ . }}"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', '{{ . }}');
  </script>
  {{- end }}
</head>
