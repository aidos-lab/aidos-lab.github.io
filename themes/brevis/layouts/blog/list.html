{{- define "main" }}
  <h1>{{ .Title }}</h1>

  {{- .Content }}

  <ul>
    {{- range .Pages }}
      <li>
        <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006-01-02" }}</time>: <a href="{{ .RelPermalink }}">{{ .Title | safeHTML }}</a>
      </li>
    {{- end }}
  </ul>
{{- end }}
